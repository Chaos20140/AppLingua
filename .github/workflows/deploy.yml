name: Test & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Qualitäts-Gate: Unit-Tests (Engine, Sync, Inhalte, Generatoren) müssen grün sein.
      - run: npm test

      # Projektseite: https://chaos20140.github.io/AppLingua/
      # Supabase-Werte sind öffentlich (anon key, Schutz über RLS) und kommen aus den
      # Repository-Variablen (Settings → Secrets and variables → Actions → Variables).
      # Ohne Werte läuft AppLingua im lokalen Modus.
      - run: npm run build
        env:
          VITE_BASE_PATH: /AppLingua/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_APPLE_LOGIN: ${{ vars.VITE_ENABLE_APPLE_LOGIN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
